<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Shop Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mobile Shop Catalogue</h1>
    <p>CA Lab Exam &middot; Section 3MCA03 &middot; Set B</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Phones</button>
          <button id="top-three" type="button">3 Cheapest Phones</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by brand</h2>
        <form id="search-form" class="inline">
          <select name="brand" required>
            <option value="">Choose a brand...</option>
            <option value="Nova">Nova</option>
            <option value="Zenix">Zenix</option>
            <option value="Orion">Orion</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Price at most
            <input type="number" name="maxPrice" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Phone</h2>
        <form id="add-form" class="stack">
        <label>Name
          <input type="text" name="name" required>
        </label>
        <label>Brand
          <select name="brand" required>
            <option value="">Choose...</option>
            <option value="Nova">Nova</option>
            <option value="Zenix">Zenix</option>
            <option value="Orion">Orion</option>
          </select>
        </label>
        <label>RAM (GB)
          <input type="number" name="ram" step="1" required>
        </label>
        <label>Price
          <input type="number" name="price" step="1" required>
        </label>
          <button type="submit">Add Phone</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
